# Continuous integration, in the course's order (Lab 4, Task 2): cheap checks first, so a
# schema mistake fails in 30 seconds rather than after an image build.
#
#   secret scan → lint → portability audit → unit → data contract → model behaviour
#        → build images → integration test            (deploy is cd.yml: main only, green only)

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # First, and on its own: the only failure a later commit cannot undo — once a key is pushed
  # it is disclosed. Stdlib only, so it reports in seconds.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # NOT optional. Depth 1 would let the scan pass on a history full of keys; the
          # scanner refuses a shallow clone rather than pass it.
          fetch-depth: 0
      - name: Scan history for credentials
        run: python3 scripts/scan_secrets.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (hash-checked)
        run: |
          pip install --upgrade pip
          pip install --require-hashes -r requirements.txt
      - name: Lint
        run: ruff check src/ cloudlayer/ scripts/ tests/
      - name: Portability audit
        run: python scripts/portability_audit.py
      # The real file, sha256-verified against the value recorded in the script: a pull
      # request that changes what arrives is exactly what the contract tests below stop.
      - name: Fetch the dataset
        run: python scripts/download_data.py
      - name: Unit tests
        run: pytest -q tests/test_features.py tests/test_forecast.py tests/test_registry.py tests/test_pipeline.py
      - name: Data contract tests
        run: pytest -q tests/test_data.py
      - name: Model behaviour tests
        run: pytest -q tests/test_model_behaviour.py
      - name: The planned failure must still be caught
        # The project brief's dotted edge: the frozen-feed failure, fed back into the tests.
        # If the alert stops firing within three hours, this step fails and nothing ships.
        run: pytest -q tests/test_frozen_feed_alert.py

  build:
    # Nothing is built from a commit that leaks a credential or fails a test.
    needs: [secrets, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Images are tagged with the commit SHA, never `latest`: "which code is serving?" must
      # have one answer during an incident.
      - name: Build training image
        run: docker buildx build --platform linux/amd64 -t bike-train:${{ github.sha }} --load .
      - name: Build job image
        run: docker buildx build --platform linux/amd64 -f Dockerfile.job -t bike-job:${{ github.sha }} --load .
      - name: Fetch the dataset
        run: python3 scripts/download_data.py
      - name: Integration test — train, register, run the job, freeze the feed
        run: bash scripts/integration_test.sh ${{ github.sha }}
